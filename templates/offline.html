<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Gigamas Offline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff7ed;
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 24px;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,.12);
        }

        img {
            width: 100px;
            margin-bottom: 18px;
        }

        h1 {
            color: #f97316;
            margin-bottom: 10px;
        }

        p {
            color: #6b7280;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="/static/img/logo_gigamas.png" alt="Gigamas">
        <h1>Gigamas Offline</h1>
        <p>
            Koneksi internet sedang tidak tersedia.
            Silakan periksa jaringan Anda, lalu buka kembali aplikasi Gigamas.
        </p>
    </div>
</body>
</html>
